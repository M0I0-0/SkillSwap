<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap - Notificaciones</title>
  <link rel="stylesheet" href="/styles/notificaciones.css">
</head>
<body>
  <div class="notif-page">
    <nav class="ss-nav">
      <div class="ss-logo">
        <div class="ss-logo-icon">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 8C3 5.24 5.24 3 8 3s5 2.24 5 5-2.24 5-5 5-5-2.24-5-5z" stroke="white" stroke-width="1.5"/>
            <path d="M6 8l1.5 1.5L10 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        SkillSwap
      </div>

      <div class="ss-nav-links">
        <button class="ss-nav-link active" type="button" onclick="window.location.href='/dashboard'">Inicio</button>
        <button class="ss-nav-link" type="button">Enseñar</button>
        <button class="ss-nav-link" type="button">Mis cursos</button>
        <button class="ss-nav-link" type="button" onclick="window.location.href='/mensajeria'">Mensajeria</button>
      </div>

      <div class="ss-nav-right">
        <div class="ss-icon-btn" title="Mensajes" onclick="window.location.href='/mensajeria'">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 3h12v8H9l-3 2V11H2V3z" stroke="white" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="ss-notif-wrapper" id="notif-btn" onclick="togglePanel()">
          <div class="ss-icon-btn ss-icon-btn-active" title="Notificaciones">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M8 2a4 4 0 00-4 4v2l-1 2h10l-1-2V6a4 4 0 00-4-4zM6.5 12a1.5 1.5 0 003 0" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
            <div class="notif-dot"></div>
          </div>
          <span id="notif-badge"></span>

          <div id="notif-panel">
            <div class="notif-panel-header">
              <h3>Notificaciones</h3>
              <span onclick="event.stopPropagation(); marcarTodasLeidasDesdeUI()">
                Marcar todas como leidas
              </span>
            </div>
            <div id="notif-lista"></div>
          </div>
        </div>

        <button class="ss-avatar" id="ss-nav-avatar" type="button" onclick="window.location.href='/perfil'" title="Ir al perfil">SS</button>
      </div>
    </nav>

    <main class="notif-shell">
      <section class="notif-board notif-board-single">
        <aside class="notif-sidebar">
          <div class="notif-profile-card">
            <div class="notif-profile-top">
              <div class="notif-profile-avatar ss-profile-avatar" id="ss-profile-avatar">SS</div>
              <div>
                <div class="notif-profile-name" id="ss-profile-name">Cargando...</div>
                <div class="notif-profile-career" id="ss-profile-career">Cargando perfil...</div>
              </div>
            </div>
          </div>

          <div class="notif-menu-card">
            <button class="notif-main-link is-active" type="button">
              <span class="notif-main-link-icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M5 8a3 3 0 116 0v1.3l1 1.7H4l1-1.7V8zm1.5 4a1.5 1.5 0 003 0" fill="currentColor"/>
                </svg>
              </span>
              Lista de notificaciones
            </button>
          </div>

          <div class="notif-summary-card">
            <div class="notif-sidebar-title">Resumen</div>
            <div class="notif-summary-item">
              <span>Total</span>
              <strong id="notif-total-count">0</strong>
            </div>
            <div class="notif-summary-item">
              <span>No leidas</span>
              <strong id="notif-unread-count">0</strong>
            </div>
          </div>
        </aside>

        <section class="notif-content">
          <header class="notif-toolbar notif-toolbar-simple">
            <div>
              <h1 class="notif-title">Notificaciones</h1>
              <p class="notif-subtitle">Aqui se muestran unicamente los registros reales guardados en la base de datos.</p>
            </div>
            <button class="notif-inline-action secondary" id="notif-mark-read-btn" type="button">
              Marcar todas como leidas
            </button>
          </header>

          <div class="notif-section">
            <div class="notif-list-card notif-list-card-full" id="notif-full-list"></div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="/js/session.js"></script>
  <script src="/js/notificaciones.js"></script>
</body>
</html>
