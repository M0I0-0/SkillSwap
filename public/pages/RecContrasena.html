<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recuperar Contraseña - Skillswap</title>
  <link rel="stylesheet" href="/styles/RecContrasena.css">
</head>
<body>

  <div class="container">

    <!-- LADO IZQUIERDO -->
    <div class="left">
      <h1>Skillswap</h1>
      <p>Recupera el acceso a tu cuenta fácilmente y continúa aprendiendo.</p>
    </div>

    <!-- TARJETA -->
    <div class="card">
      <h2>Recuperar Contraseña</h2>
      <p>Ingresa tu correo electrónico y te enviaremos instrucciones.</p>

      <div class="input-group">
        <label>Correo Electrónico</label>
        <input type="email" placeholder="Ingresa tu correo">
      </div>

      <button class="btn">Enviar Instrucciones</button>

      <div class="footer">
        ¿Recordaste tu contraseña? <a href="/">Inicia Sesión</a>
      </div>
    </div>

  </div>

</body>
</html>
