<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - Skillswap</title>
  <link rel="stylesheet" href="/styles/RecContrasena.css">
</head>
<body>

  <div class="container">

    <!-- LADO IZQUIERDO -->
    <div class="left">
      <h1>Skillswap</h1>
      <p>Recupera el acceso a tu cuenta fácilmente y continúa aprendiendo.</p>
    </div>

    <!-- TARJETA -->
    <div class="card">
      <h2>Recuperar Contraseña</h2>
      <p>Ingresa tu correo electrónico y te enviaremos instrucciones.</p>

      <form id="recover-form">
        <div class="input-group">
          <label for="recover-email">Correo Electrónico</label>
          <input id="recover-email" name="email" type="email" placeholder="Ingresa tu correo" required>
        </div>

        <p id="recover-message" class="status-message" aria-live="polite"></p>
        <button type="submit" class="btn">Enviar Instrucciones</button>
      </form>

      <div class="footer">
        ¿Recordaste tu contraseña? <a href="/">Inicia Sesión</a>
      </div>
    </div>

  </div>

  <script src="/js/recuperar.js"></script>
</body>
</html>
