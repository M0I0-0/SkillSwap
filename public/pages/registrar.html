<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillswap - Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/styles/registrar.css">
    <script src="/js/registrar.js"></script>
</head>
<body>
    <div class="container">
        <main class="register-card">
            <h1 class="main-title">Crea tu Cuenta</h1>

            <form class="register-form" id="registerForm" action="/registrar" method="POST" novalidate>
                <p class="section-label">1. Datos Personales</p>

                <div class="grid-3">
                    <div class="input-group">
                        <label for="nombres">Nombres*</label>
                        <input type="text" id="nombres" name="nombres" placeholder="Ingresa tus nombres">
                        <small class="error-message"></small>
                    </div>

                    <div class="input-group">
                        <label for="apellidoPaterno">Apellido Paterno*</label>
                        <input type="text" id="apellidoPaterno" name="apellidoPaterno" placeholder="Ingresa tu apellido paterno">
                        <small class="error-message"></small>
                    </div>

                    <div class="input-group">
                        <label for="apellidoMaterno">Apellido Materno*</label>
                        <input type="text" id="apellidoMaterno" name="apellidoMaterno" placeholder="Ingresa tu apellido materno">
                        <small class="error-message"></small>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="input-group">
                        <label for="matricula">Matrícula*</label>
                        <input type="text" id="matricula" name="matricula" placeholder="Ej. 1234567">
                        <small class="error-message"></small>
                    </div>

                    <div class="input-group">
                        <label for="carrera">Carrera*</label>
                        <input type="text" id="carrera" name="carrera" placeholder="Ej. Ingeniería en Sistemas">
                        <small class="error-message"></small>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="input-group">
                        <label for="correo">Correo Electrónico*</label>
                        <div class="input-with-icon">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo">
                        </div>
                        <small class="error-message"></small>
                    </div>

                    <div class="input-group">
                        <label for="intereses">Intereses*</label>
                        <input type="text" id="intereses" name="intereses" placeholder="Intereses">
                        <small class="error-message"></small>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="input-group">
                        <label for="disponibilidad">Disponibilidad*</label>
                        <select id="disponibilidad" name="disponibilidad">
                            <option value="">Selecciona tu horario</option>
                            <option value="Matutino">Matutino</option>
                            <option value="Vespertino">Vespertino</option>
                        </select>
                        <small class="error-message"></small>
                    </div>

                    <div class="security-stack">
                        <div class="input-group">
                            <label for="password">Contraseña*</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" id="password" name="password" placeholder="Ingresa tu nueva contraseña">
                            </div>
                            <span class="helper-text">Mín. 8 caracteres, una mayúscula, un número y un carácter especial.</span>
                            <small class="error-message"></small>
                        </div>

                        <div class="input-group">
                            <label for="confirmPassword">Confirmar Contraseña*</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirma tu contraseña">
                            </div>
                            <small class="error-message"></small>
                        </div>
                    </div>
                </div>

                <button type="submit" class="create-btn">Crear Cuenta</button>
            </form>
        </main>

        <button class="back-btn">
            <a href="/">
                <i class="fa-solid fa-arrow-left"></i> Regresar al menú principal
            </a>
        </button>
    </div>

    <script src="/js/registrar.js"></script>
</body>
</html>
