<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillswap - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f7f6;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .nav-links {
            list-style: none;
            padding: 0;
        }
        .nav-links li {
            padding: 15px;
            border-bottom: 1px solid #34495e;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .main-content {
            flex: 1;
            padding: 40px;
        }
        .welcome-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .welcome-card h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>Skillswap</h2>
        <ul class="nav-links">
            <li><a href="#"><i class="fas fa-home"></i> Inicio</a></li>
            <li><a href="#"><i class="fas fa-user"></i> Perfil</a></li>
            <li><a href="#"><i class="fas fa-book"></i> Mis Habilidades</a></li>
            <li><a href="#"><i class="fas fa-search"></i> Buscar</a></li>
            <li><a href="/"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="welcome-card">
            <h1>¡Bienvenido a Skillswap!</h1>
            <p>Explora nuevas habilidades y comparte tus conocimientos con la comunidad.</p>
            <div class="stats-container" style="display: flex; justify-content: space-around; margin-top: 30px;">
                <div>
                    <h3>0</h3>
                    <p>Intercambios</p>
                </div>
                <div>
                    <h3>0</h3>
                    <p>Habilidades</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
