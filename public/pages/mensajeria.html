<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap - Mensajeria</title>
  <link rel="stylesheet" href="/styles/mensajeria.css">
</head>
<body>
  <div class="msg-page">
    <div class="modal-overlay hidden" id="modal">
      <div class="modal">
        <div class="modal-logo">
          <div class="modal-logo-icon">
            <svg viewBox="0 0 16 16" fill="none" width="18" height="18">
              <path d="M3 8C3 5.24 5.24 3 8 3s5 2.24 5 5-2.24 5-5 5-5-2.24-5-5z" stroke="white" stroke-width="1.5"/>
              <path d="M6 8l1.5 1.5L10 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          SkillSwap
        </div>
        <div>
          <h2>Cambiar de sala</h2>
          <p>Tu nombre se toma automaticamente desde tu perfil.</p>
        </div>
        <div>
          <label for="inputSala">Sala de chat</label>
          <select id="inputSala">
            <option value="general">General</option>
            <option value="algebra">Algebra</option>
            <option value="programacion">Programacion</option>
            <option value="diseno">Diseno</option>
          </select>
        </div>
        <button class="modal-btn" id="btnEntrar" type="button">Entrar a la sala</button>
      </div>
    </div>

    <nav class="ss-nav">
      <div class="ss-logo">
        <div class="ss-logo-icon">
          <svg viewBox="0 0 16 16" fill="none" width="16" height="16">
            <path d="M3 8C3 5.24 5.24 3 8 3s5 2.24 5 5-2.24 5-5 5-5-2.24-5-5z" stroke="white" stroke-width="1.5"/>
            <path d="M6 8l1.5 1.5L10 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        SkillSwap
      </div>

      <div class="ss-nav-links">
        <button class="ss-nav-link" type="button" onclick="window.location.href='/dashboard'">Inicio</button>
        <button class="ss-nav-link" type="button" onclick="window.location.href='/dashboard?view=ensenar'">Ensenar</button>
        <button class="ss-nav-link" type="button" onclick="window.location.href='/dashboard?view=miscursos'">Mis cursos</button>
        <button class="ss-nav-link active" type="button">Mensajeria</button>
      </div>

      <div class="ss-nav-right">
        <div class="ss-notif-wrapper" id="notif-btn" onclick="togglePanel()">
          <div class="ss-icon-btn" title="Notificaciones">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M8 2a4 4 0 00-4 4v2l-1 2h10l-1-2V6a4 4 0 00-4-4zM6.5 12a1.5 1.5 0 003 0" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
            <div class="notif-dot"></div>
          </div>
          <span id="notif-badge"></span>
          <div id="notif-panel">
            <div class="notif-panel-header">
              <h3>Notificaciones</h3>
              <span onclick="event.stopPropagation(); marcarTodasLeidas(); renderizarPanel(); actualizarBadge()">
                Marcar todas como leidas
              </span>
            </div>
            <div id="notif-lista"></div>
            <div class="notif-panel-footer">
              <button class="notif-panel-link" type="button" onclick="event.stopPropagation(); window.location.href='/notificaciones'">
                Ver todas las notificaciones
              </button>
            </div>
          </div>
        </div>
        <button class="ss-avatar" id="navAvatar" type="button" onclick="window.location.href='/perfil'" title="Ir al perfil">SS</button>
      </div>
    </nav>

    <div class="msg-shell">
      <div class="msg-panel">
        <aside class="msg-sidebar">
          <div class="msg-sidebar-header">
            <div>
              <h1>Chats</h1>
              <p class="msg-sidebar-subtitle">Conversa en tiempo real con tu comunidad.</p>
            </div>
            <span class="msg-sala-badge" id="salaLabel">-</span>
          </div>

          <div class="msg-sidebar-section">
            <p class="msg-sidebar-label">En la sala</p>
          </div>

          <div class="msg-chat-list" id="usuariosList"></div>
          <div class="msg-sidebar-spacer"></div>

          <button class="msg-new-btn" type="button" id="btnCambiarSala">Cambiar sala</button>
        </aside>

        <section class="msg-conversation">
          <header class="msg-conversation-header">
            <div class="msg-avatar msg-avatar-lg av-blue" id="headerAvatar">SS</div>
            <div class="msg-header-info">
              <div class="msg-conversation-name" id="headerNombre">Sala de chat</div>
              <div class="msg-online-indicator">
                <span class="msg-online-dot"></span>
                <span id="headerConteo">Conectando...</span>
              </div>
              <div class="msg-sala-info" id="headerSala"></div>
            </div>
          </header>

          <div class="msg-messages" id="mensajesContainer"></div>

          <form class="msg-compose" id="formMensaje">
            <input type="text" id="inputMensaje" placeholder="Escribe un mensaje..." autocomplete="off" disabled>
            <button type="submit" id="btnEnviar" disabled>
              Enviar
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M2 8h12M10 4l4 4-4 4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
        </section>
      </div>
    </div>
  </div>

  <script src="/js/session.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/mensajeria.js"></script>
  <script src="/js/notificaciones.js"></script>
</body>
</html>
