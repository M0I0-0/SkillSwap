<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap - Mensajería</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --bg-panel: #17171a;
      --bg-card: #1e1e22;
      --bg-input: #26262c;
      --border: #2e2e35;
      --accent: #7c6af7;
      --accent-light: #a99af9;
      --sent-bg: #7c6af7;
      --recv-bg: #26262c;
      --text: #eeeef0;
      --text-sub: #888898;
      --text-dim: #555565;
      --online: #4ade80;
      --radius: 12px;
      --radius-msg: 18px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── MODAL DE ENTRADA ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      transition: opacity .3s;
    }
    .modal-overlay.hidden { opacity: 0; pointer-events: none; }

    .modal {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      width: min(420px, 90vw);
      display: flex; flex-direction: column; gap: 20px;
    }
    .modal-logo { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 600; }
    .modal-logo-icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: grid; place-items: center;
    }
    .modal h2 { font-size: 1.4rem; font-weight: 600; }
    .modal p { color: var(--text-sub); font-size: .9rem; }
    .modal label { font-size: .85rem; color: var(--text-sub); margin-bottom: 6px; display: block; }
    .modal input, .modal select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 12px 14px;
      font-size: .95rem; font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }
    .modal input:focus, .modal select:focus { border-color: var(--accent); }
    .modal select option { background: var(--bg-panel); }
    .modal-btn {
      background: var(--accent);
      color: #fff; border: none; cursor: pointer;
      border-radius: var(--radius);
      padding: 13px;
      font-size: .95rem; font-weight: 600; font-family: inherit;
      transition: opacity .2s, transform .15s;
    }
    .modal-btn:hover { opacity: .9; transform: translateY(-1px); }

    /* ── NAV ── */
    .ss-nav {
      display: flex; align-items: center; gap: 24px;
      padding: 0 24px; height: 56px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ss-logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .95rem; }
    .ss-logo-icon {
      width: 28px; height: 28px; background: var(--accent);
      border-radius: 7px; display: grid; place-items: center;
    }
    .ss-nav-links { display: flex; gap: 4px; margin-left: auto; }
    .ss-nav-link {
      background: none; border: none; cursor: pointer;
      color: var(--text-sub); font-family: inherit; font-size: .85rem;
      padding: 6px 12px; border-radius: 8px;
      transition: background .15s, color .15s;
    }
    .ss-nav-link:hover, .ss-nav-link.active { background: var(--bg-card); color: var(--text); }
    .ss-nav-right { display: flex; align-items: center; gap: 10px; }
    .ss-icon-btn {
      width: 32px; height: 32px; border-radius: 8px;
      display: grid; place-items: center; cursor: pointer;
      transition: background .15s;
    }
    .ss-icon-btn:hover { background: var(--bg-card); }
    .notif-dot {
      width: 6px; height: 6px; background: var(--accent);
      border-radius: 50%; position: absolute; top: 10px; right: 10px;
    }
    .ss-icon-btn { position: relative; }
    .ss-avatar {
      width: 30px; height: 30px; background: var(--accent);
      border-radius: 50%; display: grid; place-items: center;
      font-size: .75rem; font-weight: 600;
    }

    /* ── SHELL ── */
    .msg-shell { flex: 1; display: flex; overflow: hidden; }

    /* ── SIDEBAR ── */
    .msg-sidebar {
      width: 260px; flex-shrink: 0;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .msg-sidebar-header {
      padding: 20px 18px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .msg-sidebar-header h1 { font-size: 1rem; font-weight: 600; }
    .msg-sala-badge {
      font-size: .7rem; font-family: 'DM Mono', monospace;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 8px; color: var(--accent-light);
    }
    .msg-chat-list { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
    .msg-user-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; border-radius: 10px; cursor: default;
      transition: background .15s;
    }
    .msg-user-item:hover { background: var(--bg-card); }
    .msg-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: .75rem; font-weight: 600; flex-shrink: 0;
    }
    .av-purple { background: var(--accent); }
    .av-blue   { background: #3b82f6; }
    .av-amber  { background: #f59e0b; }
    .av-green  { background: #10b981; }
    .av-rose   { background: #f43f5e; }
    .msg-user-info { flex: 1; min-width: 0; }
    .msg-user-name { font-size: .875rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg-user-you  { font-size: .72rem; color: var(--accent-light); }
    .msg-online-dot-small {
      width: 7px; height: 7px; background: var(--online);
      border-radius: 50%; flex-shrink: 0;
    }
    .msg-sidebar-section { padding: 16px 18px 8px; }
    .msg-sidebar-label {
      font-size: .72rem; font-weight: 600; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px;
    }
    .msg-new-btn {
      margin: auto 14px 14px;
      background: var(--accent); color: #fff; border: none; cursor: pointer;
      border-radius: var(--radius); padding: 10px;
      font-size: .85rem; font-weight: 600; font-family: inherit;
      transition: opacity .2s;
    }
    .msg-new-btn:hover { opacity: .85; }

    /* ── CONVERSACIÓN ── */
    .msg-conversation {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; background: var(--bg);
    }
    .msg-conversation-header {
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
      background: var(--bg-panel); flex-shrink: 0;
    }
    .msg-avatar-lg { width: 40px; height: 40px; font-size: .85rem; }
    .msg-header-info { flex: 1; }
    .msg-conversation-name { font-size: .95rem; font-weight: 600; }
    .msg-online-indicator { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .msg-online-dot {
      width: 8px; height: 8px; background: var(--online);
      border-radius: 50%; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .msg-online-text { font-size: .78rem; color: var(--text-sub); }
    .msg-sala-info { font-size: .72rem; font-family: 'DM Mono', monospace; color: var(--text-dim); margin-top: 2px; }

    /* ── MENSAJES ── */
    .msg-messages {
      flex: 1; overflow-y: auto;
      padding: 24px; display: flex; flex-direction: column;
      gap: 12px; scroll-behavior: smooth;
    }
    .msg-messages::-webkit-scrollbar { width: 4px; }
    .msg-messages::-webkit-scrollbar-track { background: transparent; }
    .msg-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg-message-group { display: flex; flex-direction: column; gap: 4px; max-width: 70%; }
    .msg-message-group.sent   { align-self: flex-end;   align-items: flex-end; }
    .msg-message-group.received { align-self: flex-start; align-items: flex-start; }

    .msg-sender-name { font-size: .72rem; color: var(--text-dim); margin-bottom: 2px; padding: 0 4px; }
    .msg-bubble {
      padding: 10px 14px; border-radius: var(--radius-msg);
      font-size: .9rem; line-height: 1.45; word-break: break-word;
      animation: slideIn .2s ease;
    }
    @keyframes slideIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .msg-message-group.sent     .msg-bubble { background: var(--sent-bg); color: #fff; border-bottom-right-radius: 6px; }
    .msg-message-group.received .msg-bubble { background: var(--recv-bg); color: var(--text); border-bottom-left-radius: 6px; }
    .msg-time { font-size: .7rem; color: var(--text-dim); padding: 0 4px; }

    .msg-typing-indicator {
      align-self: flex-start;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; background: var(--recv-bg);
      border-radius: var(--radius-msg); border-bottom-left-radius: 6px;
      font-size: .8rem; color: var(--text-sub);
    }
    .typing-dots { display: flex; gap: 3px; }
    .typing-dots span {
      width: 5px; height: 5px; background: var(--text-dim);
      border-radius: 50%; animation: dot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot { 0%,80%,100%{opacity:.3;transform:scale(1)} 40%{opacity:1;transform:scale(1.2)} }

    .msg-system {
      align-self: center; font-size: .75rem; color: var(--text-dim);
      background: var(--bg-card); padding: 4px 12px;
      border-radius: 20px; border: 1px solid var(--border);
    }

    /* ── COMPOSE ── */
    .msg-compose {
      padding: 16px 24px; border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: center;
      background: var(--bg-panel); flex-shrink: 0;
    }
    .msg-compose input {
      flex: 1; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 24px; color: var(--text); padding: 11px 18px;
      font-size: .9rem; font-family: inherit; outline: none;
      transition: border-color .2s;
    }
    .msg-compose input:focus { border-color: var(--accent); }
    .msg-compose input::placeholder { color: var(--text-dim); }
    .msg-compose button {
      background: var(--accent); color: #fff; border: none; cursor: pointer;
      border-radius: 20px; padding: 11px 20px;
      font-size: .875rem; font-weight: 600; font-family: inherit;
      display: flex; align-items: center; gap: 6px;
      transition: opacity .2s, transform .15s; flex-shrink: 0;
    }
    .msg-compose button:hover { opacity: .9; transform: scale(1.02); }
    .msg-compose button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>

  <!-- MODAL DE SALA -->
  <div class="modal-overlay hidden" id="modal">
    <div class="modal">
      <div class="modal-logo">
        <div class="modal-logo-icon">
          <svg viewBox="0 0 16 16" fill="none" width="18" height="18">
            <path d="M3 8C3 5.24 5.24 3 8 3s5 2.24 5 5-2.24 5-5 5-5-2.24-5-5z" stroke="white" stroke-width="1.5"/>
            <path d="M6 8l1.5 1.5L10 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        SkillSwap
      </div>
      <div>
        <h2>Cambiar de sala</h2>
        <p style="margin-top:6px">Tu nombre se toma automáticamente desde tu perfil.</p>
      </div>
      <div>
        <label for="inputSala">Sala de chat</label>
        <select id="inputSala">
          <option value="general">💬 General</option>
          <option value="algebra">📐 Álgebra</option>
          <option value="programacion">💻 Programación</option>
          <option value="diseño">🎨 Diseño</option>
        </select>
      </div>
      <button class="modal-btn" id="btnEntrar">Entrar a la sala →</button>
    </div>
  </div>

  <!-- NAV -->
  <nav class="ss-nav">
    <div class="ss-logo">
      <div class="ss-logo-icon">
        <svg viewBox="0 0 16 16" fill="none" width="16" height="16">
          <path d="M3 8C3 5.24 5.24 3 8 3s5 2.24 5 5-2.24 5-5 5-5-2.24-5-5z" stroke="white" stroke-width="1.5"/>
          <path d="M6 8l1.5 1.5L10 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      SkillSwap
    </div>
    <div class="ss-nav-links">
      <button class="ss-nav-link" type="button" onclick="window.location.href='/dashboard'">Inicio</button>
      <button class="ss-nav-link" type="button">Enseñar</button>
      <button class="ss-nav-link" type="button">Mis cursos</button>
      <button class="ss-nav-link active" type="button">Mensajería</button>
    </div>
    <div class="ss-nav-right">
      <div class="ss-icon-btn" title="Notificaciones">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 2a4 4 0 00-4 4v2l-1 2h10l-1-2V6a4 4 0 00-4-4zM6.5 12a1.5 1.5 0 003 0" stroke="var(--text-sub)" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <div class="notif-dot"></div>
      </div>
      <div class="ss-avatar" id="navAvatar">??</div>
    </div>
  </nav>

  <!-- SHELL -->
  <div class="msg-shell">

    <!-- SIDEBAR -->
    <aside class="msg-sidebar">
      <div class="msg-sidebar-header">
        <h1>Chats</h1>
        <span class="msg-sala-badge" id="salaLabel">—</span>
      </div>
      <div class="msg-sidebar-section" style="padding-top:10px;">
        <p class="msg-sidebar-label">En la sala</p>
      </div>
      <div class="msg-chat-list" id="usuariosList"></div>
      <div style="flex:1"></div>
      <button class="msg-new-btn" type="button" id="btnCambiarSala">⇄ Cambiar sala</button>
    </aside>

    <!-- CONVERSACIÓN -->
    <section class="msg-conversation">
      <header class="msg-conversation-header">
        <div class="msg-avatar msg-avatar-lg av-blue" id="headerAvatar">??</div>
        <div class="msg-header-info">
          <div class="msg-conversation-name" id="headerNombre">Sala de chat</div>
          <div class="msg-online-indicator">
            <span class="msg-online-dot"></span>
            <span class="msg-online-text" id="headerConteo">Conectando...</span>
          </div>
          <div class="msg-sala-info" id="headerSala"></div>
        </div>
      </header>

      <div class="msg-messages" id="mensajesContainer"></div>

      <form class="msg-compose" id="formMensaje">
        <input type="text" id="inputMensaje" placeholder="Escribe un mensaje..." autocomplete="off" disabled>
        <button type="submit" id="btnEnviar" disabled>
          Enviar
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M2 8h12M10 4l4 4-4 4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </section>
  </div>

  <!-- Socket.io se sirve automáticamente desde el servidor -->
  <script src="/js/session.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/mensajeria.js"></script>
</body>
</html>
